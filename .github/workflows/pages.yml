name: Publish BTVN demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
      - run: node --test tests/demo.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website only
        run: |
          mkdir -p pages-artifact
          cp index.html .nojekyll pages-artifact/
          cp -r assets pages-artifact/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
