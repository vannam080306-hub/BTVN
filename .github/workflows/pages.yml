name: Publish BTVN to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
      - run: node --test tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website only
        run: |
          mkdir -p pages-artifact
          cp index.html .nojekyll pages-artifact/
          cp -r assets pages-artifact/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact
          include-hidden-files: true
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The Pages artifact is not visible to the deployment API.'
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
