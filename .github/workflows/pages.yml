name: Publish BTVN to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-pages.mjs
      - run: node --test tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website only
        run: |
          mkdir -p pages-artifact
          cp index.html .nojekyll pages-artifact/
          cp -r assets pages-artifact/
      - uses: actions/upload-pages-artifact@v5
        id: package
        with:
          path: pages-artifact
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.package.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              core.setFailed('The Pages upload step did not return an artifact ID.');
              return;
            }
            const token = await core.getIDToken();
            core.setSecret(token);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: token
            });
            const deploymentId = deployment.id ?? deployment.status_url?.split('/').pop() ?? context.sha;
            for (let attempt = 0; attempt < 48; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                ...context.repo, id: deploymentId
              });
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                core.setFailed('Pages deployment ended with status ' + data.status);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Timed out waiting for Pages deployment ' + deploymentId);
